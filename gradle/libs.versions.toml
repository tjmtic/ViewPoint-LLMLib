[versions]
# AGP in lockstep with the fleet: a composite build tolerates exactly one AGP version.
agp = "8.13.2"
android-compileSdk = "36"
android-minSdk = "26"
# Kotlin matches the CBindingKMP plugin's compile target.
kotlin = "2.2.21"
kotlinx-coroutines = "1.10.2"
junit = "4.13.2"
androidx-test-runner = "1.6.2"
androidx-test-ext = "1.3.0"
play-asset-delivery = "2.3.0"
# Fleet style standard (kmp-agentic-sdlc/.claude/docs/kotlin-style.md): ktfmt kotlinlang + detekt at 0.
ktfmt = "0.27.0"
detekt = "1.23.8"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
play-asset-delivery = { module = "com.google.android.play:asset-delivery", version.ref = "play-asset-delivery" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidAssetPack = { id = "com.android.asset-pack", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
